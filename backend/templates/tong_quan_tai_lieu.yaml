id: tong_quan_tai_lieu
name: "Dàn ý Bài luận Tổng quan Tài liệu (Literature Review Article)"
document_type: tong_quan_tai_lieu
target_pages: "15-30"
description: "Dàn ý dành cho bài tổng quan hệ thống (Systematic Literature Review) hoặc bài tổng quan lý thuyết."
sections:
  - code: SEC1
    title: "1. ĐẶT VẤN ĐỀ (INTRODUCTION)"
    required: true
    subsections:
      - title: "1.1. Bối cảnh và phạm vi tổng quan"
      - title: "1.2. Mục tiêu bài tổng quan tài liệu"
      - title: "1.3. Lý do lựa chọn chủ đề"

  - code: SEC2
    title: "2. PHƯƠNG PHÁP TỔNG QUAN TÀI LIỆU (METHODOLOGY)"
    required: true
    subsections:
      - title: "2.1. Chiến lược tìm kiếm và cơ sở dữ liệu (Scopus, WoS, Google Scholar)"
      - title: "2.2. Tiêu chuẩn chọn lựa và loại trừ (Inclusion & Exclusion Criteria)"
      - title: "2.3. Quy trình trích xuất và phân loại dữ liệu (PRISMA framework)"

  - code: SEC3
    title: "3. PHÂN TÍCH CÁC CHỦ ĐỀ CHÍNH (THEMATIC ANALYSIS)"
    required: true
    subsections:
      - title: "3.1. Tổng quan xu hướng công bố theo thời gian và địa lý"
      - title: "3.2. Các chủ đề chính (Theme A, Theme B, Theme C)"
      - title: "3.3. Đánh giá sự tiến hóa của các mô hình/lý thuyết"

  - code: SEC4
    title: "4. THẢO LUẬN, KHOẢNG TRỐNG VÀ HƯỚNG NGHIÊN CỨU TƯƠNG LAI"
    required: true
    subsections:
      - title: "4.1. Nhận diện các khoảng trống nghiên cứu hiện tại (Research Gaps)"
      - title: "4.2. Khung đề xuất cho các nghiên cứu tương lai (Future Agenda)"

  - code: SEC5
    title: "5. KẾT LUẬN VÀ TÀI LIỆU THAM KHẢO"
    required: true
    subsections:
      - title: "Kết luận tóm lược"
      - title: "Danh mục tài liệu tham khảo phong phú"
